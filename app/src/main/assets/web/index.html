<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- 1816 is the usable width on the T-Box, so one CSS px maps to one physical px and map tiles stay sharp -->
  <meta name="viewport" content="width=1816, user-scalable=no">
  <title>DriveDeck</title>
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="car-panel">
    <div class="car-top">
      <div class="gears">
        <span data-gear="P" class="active">P</span><span data-gear="D">D</span>
      </div>
      <span id="car-type" class="car-type"></span>
    </div>

    <div class="speed">
      <div id="speed">0</div>
      <div class="unit">KM/H</div>
      <div id="speed-limit" class="speed-limit" hidden></div>
    </div>

    <canvas id="car3d"></canvas>
  </section>

  <section id="map-panel">
    <div id="map"></div>

    <div class="map-search" id="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>
      <input id="search-input" type="text" inputmode="none" placeholder="Navigieren" autocomplete="off" spellcheck="false">
    </div>
    <div id="search-results" class="search-results" hidden></div>

    <div id="lane-bar" class="lane-bar" hidden></div>

    <div id="nav-banner" class="nav-banner" hidden>
      <div id="nav-arrow" class="nav-arrow">
        <svg viewBox="0 0 24 24"><path d="M12 3l6 7h-4v11h-4V10H6z"/></svg>
      </div>
      <div class="nav-step">
        <b id="nav-dist"></b>
        <span id="nav-text"></span>
      </div>
    </div>

    <div id="nav-summary" class="nav-summary" hidden>
      <div><b id="nav-eta"></b><small>Ankunft</small></div>
      <div><b id="nav-time"></b><small>Dauer</small></div>
      <div><b id="nav-km"></b><small>Strecke</small></div>
      <button id="nav-mute" class="nav-btn">Ton an</button>
      <button id="nav-stop" class="nav-btn danger">Beenden</button>
    </div>

    <div class="top-status">
      <span id="weather"></span>
      <span id="gps-state">GPS ...</span>
      <span id="clock">--:--</span>
    </div>

    <button id="recenter" class="round-btn" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 3l7 18-7-4-7 4z"/></svg>
    </button>

    <div id="fps">FPS --</div>

    <div id="sheet" class="sheet" hidden></div>

    <div id="app-window" class="app-window" hidden>
      <header>
        <span id="app-title"></span>
        <button id="app-close" class="app-close">&times;</button>
      </header>
      <div id="app-body" class="app-body"></div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <div id="osk" class="osk" hidden></div>
  </section>

  <footer id="dock">
    <button class="dock-btn" data-sheet="car" title="Fahrzeug">
      <svg viewBox="0 0 24 24"><path d="M3 15l2-5a3 3 0 0 1 3-2h8a3 3 0 0 1 3 2l2 5v3H3z"/><circle cx="7" cy="16" r="1.5"/><circle cx="17" cy="16" r="1.5"/></svg>
      <span class="dock-label">Fahrzeug</span>
    </button>

    <div class="trip">
      <span><small>Höhe</small><b id="altitude">--</b></span>
      <span><small>Kurs</small><b id="course">--</b></span>
      <span><small>Genauigkeit</small><b id="accuracy">--</b></span>
      <span class="obd-extra" hidden><small>Drehzahl</small><b id="obd-rpm">--</b></span>
      <span class="obd-extra" hidden><small>Kühlmittel</small><b id="obd-coolant">--</b></span>
    </div>

    <div id="dock-apps" class="dock-apps"></div>

    <button id="media-btn" class="dock-btn" hidden></button>

    <button class="dock-btn" data-sheet="apps" title="Apps">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>
      <span class="dock-label">Apps</span>
    </button>

    <div class="volume">
      <button class="arrow-btn" data-vol="-1">&#8249;</button>
      <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
      <span id="vol">-</span>
      <button class="arrow-btn" data-vol="1">&#8250;</button>
    </div>
  </footer>
</div>

<template id="sheet-car">
  <h2>Fahrzeugtyp</h2>
  <div class="tiles" id="type-tiles"></div>
  <h2 class="sub paint-title">Lackfarbe</h2>
  <div class="tiles" id="paint-tiles"></div>
  <h2 class="sub">Ansicht</h2>
  <div class="tiles">
    <button class="tile" data-toggle="doorsOpen"><b>Türen</b><small data-label="doorsOpen"></small></button>
    <button class="tile" data-toggle="orbit"><b>360° Ansicht</b><small data-label="orbit"></small></button>
  </div>
</template>

<template id="sheet-apps">
  <div id="launcher"></div>
  <h2 class="sub">Einstellungen</h2>
  <div class="tiles">
    <button class="tile" data-toggle="fpsVisible"><b>FPS Anzeige</b><small data-label="fpsVisible"></small></button>
    <button class="tile" data-toggle="vmouse"><b>Maus</b><small data-label="vmouse"></small></button>
    <button class="tile" data-toggle="cloudVoice"><b>Stimme</b><small data-label="cloudVoice"></small></button>
    <button class="tile" data-toggle="driveLock"><b>Fahrsperre</b><small data-label="driveLock"></small></button>
    <button class="tile" data-toggle="eco"><b>3D Qualität</b><small data-label="eco"></small></button>
    <button class="tile" data-toggle="autoUpdate"><b>Update-Suche</b><small data-label="autoUpdate"></small></button>
    <button class="tile" data-action="update"><b>Nach Updates suchen</b><small data-app-version></small></button>
    <button class="tile" data-action="lang"><b>Sprache</b><small data-lang-name></small></button>
    <button class="tile" data-action="intro"><b>Einführung</b><small>Tour ansehen</small></button>
    <button class="tile" data-action="reload"><b>Neu laden</b><small>Seite</small></button>
  </div>
  <p class="credits">Concept 011: Sketchfab, CC0 &middot; Concept: eigenes Blender Modell &middot; weitere 3D Modelle: Car Kit von Kenney (CC0) &middot; Karte: Esri &middot; Suche: Photon / OpenStreetMap &middot; Routen: OSRM</p>
</template>

<script src="i18n.js"></script>
<script src="lib/three.min.js"></script>
<script src="lib/GLTFLoader.js"></script>
<script src="lib/RGBELoader.js"></script>
<script src="lib/meshopt_decoder.js"></script>
<script src="lib/leaflet.js"></script>
<script src="lib/qrcode.js"></script>
<script src="car3d.js"></script>
<script src="app.js"></script>
<script src="keyboard.js"></script>
<script src="camera.js"></script>
<script src="nav.js"></script>
<script src="apps.js"></script>
<script src="weather.js"></script>
<script src="speedlimit.js"></script>
<script src="reminders.js"></script>
<script src="media.js"></script>
<script src="browser.js"></script>
<script src="mouse.js"></script>
<script src="intro.js"></script>
<script src="updates.js"></script>
<script src="apps/assistant.js"></script>
<script src="apps/notes.js"></script>
<script src="apps/obd.js"></script>
<script src="inbox.js"></script>
<script src="apps/paint.js"></script>
<script src="apps/game2048.js"></script>
<script src="apps/snake.js"></script>
<script src="apps/karaoke.js"></script>
</body>
</html>
