plugins {
    id 'com.android.application'
}

android {
    namespace 'com.koray.tboxtesla'
    compileSdk 34

    defaultConfig {
        applicationId 'com.koray.tboxtesla'
        minSdk 28
        targetSdk 33
        versionCode 10
        versionName '1.9'
        // the T-Box is ARM, the native Vosk libraries for x86 and MIPS would only make the APK bigger
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // One fixed key for every build (local and CI), so a new APK installs over the old one and keeps
    // the app's data. It is a personal sideloaded app, the key is not a secret.
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'drivedeck'
            keyAlias 'drivedeck'
            keyPassword 'drivedeck'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // offline wake word ("DriveDeck"), see VoskWake
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
}
