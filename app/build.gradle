plugins {
    id 'com.android.application'
}

android {
    namespace 'com.koray.tboxtesla'
    compileSdk 34

    defaultConfig {
        applicationId 'com.koray.tboxtesla'
        minSdk 28
        targetSdk 33
        versionCode 3
        versionName '1.2'
    }

    // One fixed key for every build (local and CI), so a new APK installs over the old one and keeps
    // the app's data. It is a personal sideloaded app, the key is not a secret.
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'drivedeck'
            keyAlias 'drivedeck'
            keyPassword 'drivedeck'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
