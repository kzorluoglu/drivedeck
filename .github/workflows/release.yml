name: Release APK

# Push a tag like v1.1 and the signed APK shows up under Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: ./gradlew assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk DriveDeck-${GITHUB_REF_NAME}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: DriveDeck-*.apk
          generate_release_notes: true
